name: cargoflow

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cargoflow}
      POSTGRES_USER: ${POSTGRES_USER:-cargoflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cargoflow}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: cargoflow
      RABBITMQ_DEFAULT_PASS: cargoflow
    ports:
      - '15672:15672'
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: valkey/valkey:8-alpine
    command: ['valkey-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  integration-api:
    build:
      context: .
      dockerfile: apps/integration-api/Dockerfile
    environment: &backend-environment
      NODE_ENV: production
      API_PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-cargoflow}:${POSTGRES_PASSWORD:-cargoflow}@postgres:5432/${POSTGRES_DB:-cargoflow}?schema=public
      RABBITMQ_URL: amqp://cargoflow:cargoflow@rabbitmq:5672
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-cargoflow.events}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE:-cargoflow.worker}
      REDIS_URL: redis://redis:6379
      WEBHOOK_IDEMPOTENCY_TTL_SECONDS: ${WEBHOOK_IDEMPOTENCY_TTL_SECONDS:-86400}
      BITRIX_WEBHOOK_URL: ${BITRIX_WEBHOOK_URL:-}
      BITRIX_APPLICATION_TOKEN: ${BITRIX_APPLICATION_TOKEN:-}
      BITRIX_ENTITY_TYPE_ID: ${BITRIX_ENTITY_TYPE_ID:-2}
      BITRIX_CATEGORY_ID: ${BITRIX_CATEGORY_ID:-}
      BITRIX_FIELD_EXTERNAL_TRIP_ID: ${BITRIX_FIELD_EXTERNAL_TRIP_ID:-ufCrmExternalTripId}
      BITRIX_FIELD_INTEGRATION_STATUS: ${BITRIX_FIELD_INTEGRATION_STATUS:-ufCrmIntegrationStatus}
      BITRIX_FIELD_LAST_SYNC_AT: ${BITRIX_FIELD_LAST_SYNC_AT:-ufCrmLastSyncAt}
      BITRIX_FIELD_INTEGRATION_ERROR: ${BITRIX_FIELD_INTEGRATION_ERROR:-ufCrmIntegrationError}
      BITRIX_FIELD_FROM_CITY: ${BITRIX_FIELD_FROM_CITY:-ufCrmFromCity}
      BITRIX_FIELD_TO_CITY: ${BITRIX_FIELD_TO_CITY:-ufCrmToCity}
      BITRIX_FIELD_LOADING_DATE: ${BITRIX_FIELD_LOADING_DATE:-ufCrmLoadingDate}
      BITRIX_FIELD_DELIVERY_DATE: ${BITRIX_FIELD_DELIVERY_DATE:-ufCrmDeliveryDate}
      BITRIX_STAGE_ASSIGNED: ${BITRIX_STAGE_ASSIGNED:-}
      BITRIX_STAGE_LOADING: ${BITRIX_STAGE_LOADING:-}
      BITRIX_STAGE_IN_TRANSIT: ${BITRIX_STAGE_IN_TRANSIT:-}
      BITRIX_STAGE_DELIVERED: ${BITRIX_STAGE_DELIVERED:-}
      BITRIX_STAGE_CLOSED: ${BITRIX_STAGE_CLOSED:-}
      BITRIX_STAGE_CANCELLED: ${BITRIX_STAGE_CANCELLED:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    command:
      [
        'sh',
        '-c',
        'pnpm --filter @cargoflow/database db:deploy && pnpm --filter @cargoflow/database db:seed && node apps/integration-api/dist/main.js',
      ]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3001/health']
      interval: 10s
      timeout: 5s
      retries: 20

  integration-worker:
    build:
      context: .
      dockerfile: apps/integration-worker/Dockerfile
    environment: *backend-environment
    depends_on:
      integration-api: { condition: service_healthy }

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    environment:
      NUXT_PUBLIC_API_BASE: /api
      NUXT_API_BASE_INTERNAL: http://integration-api:3001
    depends_on:
      integration-api: { condition: service_healthy }

  nginx:
    image: nginx:1.29-alpine
    ports:
      - '8080:80'
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - dashboard
      - integration-api

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ['--config.file=/etc/prometheus/prometheus.yml', '--storage.tsdb.path=/prometheus']
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - '9090:9090'
    depends_on:
      integration-api: { condition: service_healthy }

  loki:
    image: grafana/loki:3.5.3
    command: ['-config.file=/etc/loki/local-config.yaml']
    volumes:
      - ./infrastructure/loki/loki.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    ports:
      - '3100:3100'

  promtail:
    image: grafana/promtail:3.5.3
    command: ['-config.file=/etc/promtail/config.yml']
    volumes:
      - ./infrastructure/loki/promtail.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - '3002:3000'
    depends_on:
      - prometheus
      - loki

volumes:
  postgres-data:
  rabbitmq-data:
  redis-data:
  prometheus-data:
  loki-data:
  grafana-data:
